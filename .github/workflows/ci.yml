name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  firmware-build:
    name: Build firmware (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "default"
            cmake_args: ""
          - name: "ECU_DRIVE_HW_PWM"
            cmake_args: "-DECU_DRIVE_HW_PWM=ON"
          - name: "ECU_DRIVE_HW_PWM+ENCODER"
            cmake_args: "-DECU_DRIVE_HW_PWM=ON -DECU_USE_ENCODER_SPEED=ON"
          - name: "ECU_DRIVE_HW_PWM+ENCODER+HW_CONFIRMED"
            cmake_args: "-DECU_DRIVE_HW_PWM=ON -DECU_USE_ENCODER_SPEED=ON -DHW_PROTECTION_CONFIRMED=ON"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: esp-idf build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.5
          target: esp32
          path: '.'
          cmake_build_args: ${{ matrix.cmake_args }}

  hosted-tests:
    name: Tests hébergés (protocol, pid, failsafe_line, ecu_command)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build & run test suites (ASan/UBSan)
        run: make -C test/unit run

  static-analysis:
    name: Static analysis (cppcheck + clang-tidy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update -q && sudo apt-get install -y cppcheck clang-tidy

      - name: cppcheck (portable libs)
        run: |
          cppcheck --enable=warning,performance,portability --std=c11 \
            --suppress=missingIncludeSystem --suppress=unusedFunction \
            --error-exitcode=1 \
            -I main/ \
            main/protocol.c main/pid.c main/ecu_command.c main/failsafe_line.c

      - name: clang-tidy (portable libs)
        # insecureAPI.DeprecatedOrUnsafeBufferHandling is a false positive for
        # bounded memcpy calls on embedded targets without C11 _s variants.
        run: |
          clang-tidy \
            --checks='-*,clang-analyzer-*,-clang-analyzer-security.insecureAPI.DeprecatedOrUnsafeBufferHandling' \
            main/protocol.c main/pid.c main/ecu_command.c main/failsafe_line.c \
            -- -std=c11 -I main/

  fuzz-smoke:
    name: Fuzzing smoke-test (protocol_decode)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Régression rapide, pas une campagne de fuzzing complète : détecte tout
      # crash/UB déjà connu ré-introduit par la PR, sans allonger le CI.
      - name: Build fuzz harness + corpus de départ
        run: |
          make -C test/fuzz fuzz_protocol_decode
          make -C test/fuzz seeds

      - name: Fuzz 30s (libFuzzer, ASan/UBSan)
        run: |
          cd test/fuzz
          mkdir -p findings
          ./fuzz_protocol_decode -max_total_time=30 -artifact_prefix=findings/ corpus/

      - name: Upload crash artifacts (si échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: test/fuzz/findings/
